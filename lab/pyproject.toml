[project]
name = "aiglab"
version = "1.0.0"
description = "AIG Measurement Lab: evidence-safe benchmark and compatibility harness for Agent Infrastructure Guide."
readme = "README.md"
requires-python = ">=3.11"
# Runtime is stdlib-only on purpose: Estate runs the harness with its own interpreter and
# no network, so nothing may need to be installed at execution time.
dependencies = []

[project.scripts]
aiglab = "aiglab.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiglab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["live: needs a running local runtime (skipped unless AIGLAB_LIVE=1)"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]
ignore = [
  "E501",   # `ruff format` owns line length; the leftovers are long string literals
  "S101",   # asserts are fine in tests
  "S603",   # subprocess with fixed argv lists is the point of the harness
  "S607",   # system tools (ps, sysctl, footprint) are resolved from a fixed PATH
  "S310",   # urllib is only pointed at the configured loopback runtime endpoint
  "RUF001",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B011"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["aiglab"]
